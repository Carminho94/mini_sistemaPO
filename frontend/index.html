<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FecapStudy</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0b211b; color: #e6f4ef; }
    header { background: #0e2a23; padding: 16px 24px; border-bottom: 2px solid #2ee59d;
             display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    header h1 { margin: 0; color: #2ee59d; font-size: 24px; }
    main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    .card { background: #0e2a23; border: 1px solid #1d4a3e; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .card h2 { margin-top: 0; font-size: 18px; }
    .perfis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .perfil { background: #0b211b; border-radius: 8px; padding: 12px; }
    .perfil b { color: #2ee59d; }
    label { display: block; margin: 8px 0 4px; font-size: 14px; color: #9fc3b8; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; border-radius: 6px;
                    border: 1px solid #1d4a3e; background: #0b211b; color: #e6f4ef; }
    button { margin-top: 12px; padding: 10px 16px; border: none; border-radius: 6px;
             background: #2ee59d; color: #04110d; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.85; }
    .barra { height: 20px; background: #0b211b; border-radius: 10px; overflow: hidden; }
    .preenchimento { height: 100%; width: 0; background: #2ee59d; transition: width 0.4s; }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #1d4a3e; padding: 6px; text-align: left; }
    #status { font-size: 14px; }
    #aviso { position: fixed; bottom: 20px; right: 20px; background: #f2c14e; color: #000;
             padding: 12px 16px; border-radius: 8px; display: none; max-width: 300px; }
  </style>
</head>
<body>
  <header>
    <h1>FecapStudy</h1>
    <span id="status">Verificando servidor...</span>
  </header>

  <main>
    <!-- Perfis (polimorfismo) -->
    <section class="card">
      <h2>Perfis</h2>
      <div class="perfis" id="perfis"></div>
    </section>

    <!-- Nova sessão -->
    <section class="card">
      <h2>Nova sessão de estudo</h2>
      <form id="formSessao">
        <label for="disciplina">Disciplina</label>
        <select id="disciplina"></select>

        <label for="modalidade">Modalidade</label>
        <select id="modalidade">
          <option value="Pomodoro">Pomodoro</option>
          <option value="Exercicios">Exercícios</option>
          <option value="Leitura">Leitura</option>
        </select>

        <label for="duracao">Duração (minutos)</label>
        <input type="number" id="duracao" value="50">

        <div id="campoPomodoro">
          <label for="ciclos">Ciclos completos</label>
          <input type="number" id="ciclos" value="2">
        </div>
        <div id="campoExercicios" hidden>
          <label for="questoes">Total de questões</label>
          <input type="number" id="questoes" value="20">
          <label for="acertos">Acertos</label>
          <input type="number" id="acertos" value="15">
        </div>
        <div id="campoLeitura" hidden>
          <label for="paginas">Páginas lidas</label>
          <input type="number" id="paginas" value="10">
          <label><input type="checkbox" id="resumo" style="width:auto"> Fiz resumo</label>
        </div>

        <button type="submit">Registrar estudo</button>
      </form>
    </section>

    <!-- Meta -->
    <section class="card">
      <h2>Meta semanal</h2>
      <p id="textoMeta"></p>
      <div class="barra"><div class="preenchimento" id="barraMeta"></div></div>
      <button id="btnNotificar">Notificar responsável</button>
    </section>

    <!-- Histórico local -->
    <section class="card">
      <h2>Histórico</h2>
      <ul id="historico"></ul>
    </section>

    <!-- Servidor -->
    <section class="card">
      <h2>Banco de dados (servidor)</h2>
      <button id="btnCarregar">Carregar histórico do servidor</button>
      <button id="btnRelatorio">Ver relatório</button>
      <div id="dadosServidor"></div>
    </section>
  </main>

  <div id="aviso"></div>

  <script src="classes.js"></script>
  <script src="app.js"></script>
</body>
</html>
